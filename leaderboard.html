<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | MINDMAZE - TANTRA 2026</title>
  <meta name="description" content="Official Central Leaderboard rankings for MINDMAZE college tech-fest quiz competition presented by ENIGMA.">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/leaderboard.css">

  <!-- Supabase JS Client library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar" aria-label="Main Navigation">
    <div class="nav-brand">
      <div class="nav-logo">MIND<span>MAZE</span></div>
      <span class="nav-badge">TANTRA 2026</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="register.html" class="nav-link">Register</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <a href="admin.html" class="nav-link" style="color:var(--accent-primary);">Admin Portal</a>
    </div>
  </nav>

  <!-- Main Wrapper -->
  <main class="main-wrapper">
    <div class="leaderboard-container">
      
      <div class="leaderboard-header">
        <h1 class="leaderboard-title">LEADERBOARD</h1>
        <p class="hand-drawn-badge">TANTRA 2026 TOP SOLVERS</p>
      </div>

      <!-- Live Online Database Notice Box -->
      <div class="demo-disclaimer-box" role="note">
        <span>🌐</span>
        <span id="leaderboard-status-msg">Central Competition Leaderboard: Scores are synchronized online via Supabase.</span>
      </div>

      <!-- Dynamic Leaderboard List -->
      <div id="leaderboard-list-container" class="leaderboard-list" aria-label="Leaderboard Rankings">
        <!-- Rendered by js/leaderboard.js -->
      </div>

      <!-- Bottom Action Row -->
      <div class="d-flex gap-2 justify-between align-center mt-4" style="flex-wrap: wrap;">
        <a href="index.html" class="btn btn-outline">← BACK TO HOME</a>
        <a href="register.html" class="btn btn-primary">ENTER MINDMAZE →</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <span>TANTRA 2026</span> • <span>ENIGMA PRESENTS</span> • <span class="text-accent">MINDMAZE</span>
      </div>
      <div class="footer-text">
        © 2026 ENIGMA Tech-Fest Competition.
      </div>
    </div>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
